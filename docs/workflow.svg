<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/>
    </marker>
  </defs>

  <!-- card background (keeps it readable in light and dark themes) -->
  <rect x="0" y="0" width="740" height="360" rx="10" fill="#ffffff"/>

  <!-- arrows -->
  <!-- row 1: left to right -->
  <line x1="230" y1="60"  x2="263" y2="60"  stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="60"  x2="508" y2="60"  stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- turn down on the right (3 -> 4) -->
  <line x1="615" y1="100" x2="615" y2="138" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- row 2: right to left -->
  <line x1="510" y1="180" x2="477" y2="180" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="180" x2="232" y2="180" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- turn down on the left (6 -> 7) -->
  <line x1="125" y1="220" x2="125" y2="258" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- row 3: left to right -->
  <line x1="230" y1="300" x2="263" y2="300" stroke="#546E7A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- boxes -->
  <!-- row 1 -->
  <g>
    <rect x="20" y="20" width="210" height="80" rx="10" fill="#E3F2FD" stroke="#90A4AE" stroke-width="1.5"/>
    <text x="125" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2733">1) Kindle Scribe</text>
    <text x="125" y="74" text-anchor="middle" font-size="13" fill="#37474F">emails a note</text>
  </g>
  <g>
    <rect x="265" y="20" width="210" height="80" rx="10" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.5"/>
    <text x="370" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2733">2) Outlook Inbox</text>
    <text x="370" y="74" text-anchor="middle" font-size="13" fill="#37474F">(the work queue)</text>
  </g>
  <g>
    <rect x="510" y="20" width="210" height="80" rx="10" fill="#E3F2FD" stroke="#90A4AE" stroke-width="1.5"/>
    <text x="615" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2733">3) Match the sender</text>
    <text x="615" y="74" text-anchor="middle" font-size="13" fill="#37474F">do-not-reply@amazon.com</text>
  </g>

  <!-- row 2 (right to left: 4, 5, 6) -->
  <g>
    <rect x="510" y="140" width="210" height="80" rx="10" fill="#FFF3E0" stroke="#90A4AE" stroke-width="1.5"/>
    <text x="615" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2733">4) Download PDF</text>
    <text x="615" y="194" text-anchor="middle" font-size="13" fill="#37474F">+ text file (if any)</text>
  </g>
  <g>
    <rect x="265" y="140" width="210" height="80" rx="10" fill="#E8F5E9" stroke="#90A4AE" stroke-width="1.5"/>
    <text x="370" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2733">5) Tag email:</text>
    <text x="370" y="194" text-anchor="middle" font-size="13" fill="#37474F">&#8220;Kindle Scribe&#8221;</text>
  </g>
  <g>
    <rect x="20" y="140" width="210" height="80" rx="10" fill="#F3E5F5" stroke="#90A4AE" stroke-width="1.5"/>
    <text x="125" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2733">6) Create OneNote</text>
    <text x="125" y="194" text-anchor="middle" font-size="13" fill="#37474F">page (printout)</text>
  </g>

  <!-- row 3 (left to right: 7, 8) -->
  <g>
    <rect x="20" y="260" width="210" height="80" rx="10" fill="#E8F5E9" stroke="#90A4AE" stroke-width="1.5"/>
    <text x="125" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2733">7) Tag email:</text>
    <text x="125" y="314" text-anchor="middle" font-size="13" fill="#37474F">&#8220;Uploaded to OneNote&#8221;</text>
  </g>
  <g>
    <rect x="265" y="260" width="210" height="80" rx="10" fill="#E0F2F1" stroke="#90A4AE" stroke-width="1.5"/>
    <text x="370" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#1A2733">8) Move email to</text>
    <text x="370" y="314" text-anchor="middle" font-size="13" fill="#37474F">the &#8220;Kindle Scribe&#8221; folder</text>
  </g>
</svg>
